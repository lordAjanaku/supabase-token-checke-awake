name: Keep Supabase Awake

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Health Function
        env:
          SUPABASE_HEALTH_CHECK_KEY: ${{ secrets.SUPABASE_HEALTH_CHECK_KEY }}

        run: |
          curl --fail-with-body \
            --show-error \
            --silent \
            --request POST \
            "https://rwdyanuhxnmbvuhupzbc.supabase.co/functions/v1/health" \
            --header "Content-Type: application/json" \
            --header "x-health-check-key: ${SUPABASE_HEALTH_CHECK_KEY}"
